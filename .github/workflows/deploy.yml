name: Deploy CI

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

concurrency:
  group: deploy-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    strategy:
      matrix:
        node-version: [20.19.0]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    - name: Init and update jsdoc submodules to latest
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "github.action@gmail.com"
        git submodule update --init --remote
        git submodule foreach '
          branch=$(git config -f "$toplevel/.gitmodules" --get "submodule.$name.branch" || echo main)
          git fetch origin "$branch"
          git checkout -B "$branch" "origin/$branch"
          git pull --ff-only origin "$branch"
        '
    - name: Commit submodule updates if changed
      run: |
          git add content/pixi-vn content/pixi-vn-json content/pixi-vn-ink content/nqtr content/pixi-vn-spine content/pixi-vn-live2d content/pixi-vn-ai
          if ! git diff --staged --quiet; then
            git commit -m "chore: update jsdoc submodules to latest [skip ci]"
            git pull --rebase origin main
            attempt=0
            while ! git push origin HEAD:main; do
              attempt=$((attempt + 1))
              if [ "$attempt" -ge 3 ]; then
                exit 1
              fi
              git pull --rebase origin main
            done
          fi
    - name: Prepare jsdoc MDX content
      # Converts jsdoc wiki pages to .mdx and adds YAML frontmatter for the build.
      # These changes are intentionally NOT committed — they are only needed for the build.
      run: python3 scripts/prepare-jsdoc-content.py
    - name: Fix jsdoc internal links for fumadocs
      # Converts relative .md/.mdx links to absolute fumadocs paths.
      # TypeDoc generates relative links that resolve incorrectly in fumadocs
      # because index.mdx pages are served without a trailing slash.
      # These changes are intentionally NOT committed — they are only needed for the build.
      run: python3 scripts/fix-jsdoc-links.py
    - name: npm install and build
      run: |
        npm install
        NODE_OPTIONS=--max-old-space-size=6096 npm run build && npm run export
    # This repo only deploys to Cloudflare Pages. Add CF_API_TOKEN and
    # CF_ACCOUNT_ID as repository secrets before this step will succeed.
    # https://github.com/cloudflare/wrangler-action
    - name: Deploy to Cloudflare Pages
      uses: cloudflare/wrangler-action@v3
      with:
        apiToken: ${{ secrets.CF_API_TOKEN }}
        accountId: ${{ secrets.CF_ACCOUNT_ID }}
        command: pages deploy out --project-name=pixi-vn-jsdoc
